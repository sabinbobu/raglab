name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - LLM Gateway (OpenAI / Anthropic)
        - Retrieval (Chroma / BM25 / Hybrid)
        - Ingestion pipeline
        - Experiment runner
        - Evaluation harness (Ragas)
        - API endpoint
        - CLI (`raglab ingest`)
        - Docker / infra
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I call POST /query with retriever=hybrid, I get a 500 error..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Ingest a PDF with `raglab ingest data/sample/`
        2. Call `POST /query` with `{"retriever": "hybrid", ...}`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: "Should return a list of RetrievedChunk with RRF scores."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, relevant config.
      placeholder: |
        - Python: 3.12.x
        - OS: macOS 15 / Ubuntu 24.04
        - Retriever: hybrid
        - Model: gpt-4o-mini
    validations:
      required: false
